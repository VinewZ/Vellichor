# Vellichor + Kokoro (CUDA). Needs an NVIDIA runtime.
services:
  vellichor:
    image: vinewz/vellichor:latest
    environment:
      # Same-compose DNS; set only for an external Kokoro.
      KOKORO_BASE_URL: ${KOKORO_BASE_URL:-http://kokoro:8880}
      KOKORO_API_KEY: ${KOKORO_API_KEY:-}
      VELLICHOR_DATA_DIR: /data
      # Framework reads PORT; translated from VELLICHOR_PORT.
      PORT: ${VELLICHOR_PORT:-5257}
    ports:
      - "${VELLICHOR_PORT:-5257}:${VELLICHOR_PORT:-5257}"
    volumes:
      - ./data/vellichor:/data
    depends_on:
      - kokoro
    restart: unless-stopped

  kokoro:
    image: hwdsl2/kokoro-server:cuda
    container_name: kokoro-cuda
    restart: always
    environment:
      KOKORO_API_KEY: ${KOKORO_API_KEY:-}
      #KOKORO_VOICE: af_heart
      #KOKORO_LANG_CODE: a
    ports:
      - "8880:8880/tcp" # For a host-based reverse proxy, change to "127.0.0.1:8880:8880/tcp"
    volumes:
      - ./data/kokoro:/var/lib/kokoro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
